name: ztlp.net Launch tests

on:
  pull_request:
    paths:
      - 'ztlp.net/**'
      - '.github/workflows/ztlp-net-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ztlp.net/**'
      - '.github/workflows/ztlp-net-tests.yml'
  workflow_dispatch:

jobs:
  launch-app-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Launch app unittest suite
        # Launch app is intentionally stdlib-only — no pip install needed.
        # Tests cover RFC 1035 zone validation, /api/zone-available,
        # email/IP rate limiting, proof-of-work CAPTCHA, and the
        # end-to-end multi-zone onboarding flow.
        working-directory: ztlp.net
        run: python3 -m unittest discover -s tests -v
