default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV["DATABASE_URL"] %>

development:
  <<: *default
  host: 127.0.0.1
  port: 33061
  username: root
  password: devroot
  database: ztlp_admin_development

test:
  <<: *default
  host: <%= ENV.fetch("TEST_DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("TEST_DB_PORT", "33061") %>
  username: <%= ENV.fetch("TEST_DB_USER", "root") %>
  password: <%= ENV.fetch("TEST_DB_PASSWORD", "devroot") %>
  database: ztlp_admin_test

production:
  <<: *default
