# solid_queue 1.7 recurring schedule: <env>: <task key>: { class:, schedule: }.
# (A `default: dispatches: [...]` layout is silently ignored: zero tasks load.)
# Pinned by test/config/recurring_schedule_test.rb, which loads this file through
# SolidQueue::Configuration.
#
#   republish_ns        every 6 hours    re-write the zone's NS records (KEY, users, groups, devices)
#   reconcile_ns        every 30 minutes list NS records, store drift in system_settings ns_drift_json
#   expire_enrollments  every 5 minutes  pending enrollment tokens past expires_at -> expired
default: &default
  republish_ns:
    class: RepublishNsJob
    schedule: every 6 hours
  reconcile_ns:
    class: ReconcileNsJob
    schedule: every 30 minutes
  expire_enrollments:
    class: ExpireEnrollmentsJob
    schedule: every 5 minutes

production:
  <<: *default

development:
  <<: *default
