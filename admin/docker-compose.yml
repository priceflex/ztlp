# ZTLP Admin — production shape (spec §10.2). Copy to the host, set .env, `docker compose up -d`.
#
# The web + jobs services must read the SAME database as the db service. The
# canonical shape is the internal `db` service name (compose injects it into
# DATABASE_URL automatically when you omit DATABASE_URL — a host-override like
# `mysql2://...@127.0.0.1:33062/...` in .env silently re-points web/jobs at a
# different DB and they crash-loop on access-denied; the 2026-10-23 smoke tick
# hit this for ~90 minutes before it was found in the crash-loop logs).
services:
  db:
    image: mariadb:11.4.7
    container_name: ztlp-admin-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ztlp_admin
      MARIADB_USER: ztlp_admin
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: [ "admin_db:/var/lib/mysql" ]
    # Host override so the throwaway smoke DB is inspectable/reusable from the
    # box (127.0.0.1:33062) without a compose-managed port. Prod (NS box) uses
    # the plain shape. 2026-10-23: the first smoke .env carried a DATABASE_URL
    # host-override that pointed web/jobs at this box port; the compose-managed
    # db had no such user, so web stuck in "waiting for database" and jobs
    # crash-looped for ~90 min. The override is gone from .env (see its note);
    # this port is kept only so the smoke DB can be inspected from the box.
    ports: [ "127.0.0.1:33062:3306" ]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    image: ${ADMIN_IMAGE:-ztlp-admin:dev}
    container_name: ztlp-admin-web
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment: &env
      # Deliberately NOT ${DB_PASSWORD}-interpolated here: it must resolve to
      # the internal service name `db` (see the header note). A host override
      # in .env breaks the app without failing startup, which is worse.
      DATABASE_URL: mysql2://ztlp_admin:${DB_PASSWORD}@db/ztlp_admin
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      FORCE_SSL: ${FORCE_SSL:-false}
      ADMIN_ALLOWED_HOSTS: ${ADMIN_ALLOWED_HOSTS:-admin.example}
      ZTLP_ZONE: ${ZTLP_ZONE:-example.ztlp}
      ZTLP_NS_ADDR: ${ZTLP_NS_ADDR:-127.0.0.1:23096}
      ZTLP_NS_ADMIN_BASE_URL: ${ZTLP_NS_ADMIN_BASE_URL:-http://127.0.0.1:9103}
      # D5: the mandatory tunnel-identity gate. The prod box sets this to 1
      # (its default when unset); local smokes set it to 0 so the claim/
      # challenge flow stays reachable without a ZTLP gateway (Slice 12).
      ZTLP_REQUIRE_GATEWAY: ${ZTLP_REQUIRE_GATEWAY:-1}
    ports: [ "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-3000}:3000" ]
    volumes: [ "admin_data:/data" ]
  jobs:
    image: ${ADMIN_IMAGE:-ztlp-admin:dev}
    container_name: ztlp-admin-jobs
    restart: unless-stopped
    command: ["bin/jobs"]
    depends_on: [ web ]
    environment: *env
    volumes: [ "admin_data:/data" ]
volumes:
  admin_db: {}
  admin_data: {}
