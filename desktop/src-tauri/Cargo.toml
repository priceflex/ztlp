[package]
name = "ztlp-desktop"
version = "1.0.2"
edition = "2021"
description = "ZTLP Desktop — Zero Trust Layer Protocol client"
authors = ["Steven Price <steve@techrockstars.com>"]

[dependencies]
# `devtools` feature is gated to debug builds via [target.'cfg(debug_assertions)']
# section below — keeps release binaries lean and prevents the WebView inspector
# from being available in production installs.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
ztlp-proto = { path = "../../proto" }
dirs = "6.0.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }
