[package]
name = "ztlp-desktop"
version = "1.4.0"
edition = "2021"
description = "ZTLP Desktop — Zero Trust Layer Protocol client"
authors = ["Steven Price <steve@techrockstars.com>"]

[dependencies]
# `devtools` feature is enabled in release per ztlp-desktop-release skill
# §3 invariant — operators MUST be able to right-click → Inspect on shipped
# installers to triage UI bugs without a fresh build cycle. PR #89's
# WebView2 inline-handler bug took ~2 hours to repro entirely because the
# previous release shipped without devtools.
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
ztlp-proto = { path = "../../proto" }
dirs = "6.0.0"
# Windows per-user agent: HTTPS health check validated against the OS
# trust store (the same Root store the browsers use).
rustls = "0.23"
rustls-native-certs = "0.8"
# One app (and one agent supervisor) per user session.
tauri-plugin-single-instance = "2"

[dev-dependencies]
rustls-pemfile = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
