<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZTLP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Toolbar (Mac-style single window): brand on the left, Home / Setup
         tabs and a gear (Advanced settings) on the right. The .nav-item +
         data-page contract is what app.js navigates on. -->
    <header class="toolbar">
      <div class="toolbar-brand">
        <img src="assets/ztlp-logo.png" alt="ZTLP">
        <span class="brand-name">ZTLP</span>
      </div>
      <nav class="toolbar-nav" id="sidebar-nav">
        <button class="nav-item active" data-page="home">Home</button>
        <button class="nav-item" data-page="setup">Setup</button>
        <button class="nav-item nav-gear" data-page="settings" title="Advanced settings (service, identity, reset)" aria-label="Advanced settings">&#9881;</button>
      </nav>
    </header>

    <!-- Main content: exactly three pages -->
    <main class="main-content">
      <div id="page-home" class="page active"></div>
      <div id="page-setup" class="page"></div>
      <div id="page-settings" class="page"></div>
    </main>
  </div>

  <!-- Component scripts (Services / Identity / Enrollment are gone —
       enrollment lives inside Setup, identity info lives in Settings). -->
  <script src="components/live-log.js"></script>
  <script src="components/home-readiness.js"></script>
  <script src="components/home.js"></script>
  <script src="components/setup.js"></script>
  <script src="components/settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
