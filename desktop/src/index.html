<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZTLP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar: minimal, brand + 3 nav items -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="assets/ztlp-logo.png" alt="ZTLP">
        <span class="brand-name">ZTLP</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <button class="nav-item active" data-page="home">
          <span class="nav-icon">●</span> Home
        </button>
        <button class="nav-item" data-page="setup">
          <span class="nav-icon">◎</span> Setup
        </button>
        <button class="nav-item" data-page="settings">
          <span class="nav-icon">≡</span> Settings
        </button>
      </nav>
      <div class="sidebar-footer" id="sidebar-footer">ZTLP v1.0.4</div>
    </aside>

    <!-- Main content: exactly three pages -->
    <main class="main-content">
      <div id="page-home" class="page active"></div>
      <div id="page-setup" class="page"></div>
      <div id="page-settings" class="page"></div>
    </main>
  </div>

  <!-- Component scripts (Services / Identity / Enrollment are gone —
       enrollment lives inside Setup, identity info lives in Settings). -->
  <script src="components/live-log.js"></script>
  <script src="components/home.js"></script>
  <script src="components/setup.js"></script>
  <script src="components/settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
