# Source of truth for ZTLP.xcodeproj. After changing this file or adding or
# removing source files, run ios/scripts/regen-project.sh and commit the
# regenerated project.
name: ZTLP
options:
  bundleIdPrefix: com.ztlp
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: false
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: false
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    DEVELOPMENT_TEAM: 5527A7TH5P
    MARKETING_VERSION: "0.37.2"
    CURRENT_PROJECT_VERSION: "1"
    # Directory holding libztlp_proto.a. build-and-install.sh overrides this
    # with a stub library for compile checks and simulator tests.
    ZTLP_LIB_DIR: "$(PROJECT_DIR)/Libraries"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  ZTLP:
    type: application
    platform: iOS
    sources:
      - path: ZTLP
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
      - path: Shared
      - path: Libraries/ztlp_ios.h
        buildPhase: none
    entitlements:
      path: ZTLP/ZTLP.entitlements
    settings:
      base:
        INFOPLIST_FILE: ZTLP/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ztlp.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: ZTLP/ZTLP-Bridging-Header.h
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(ZTLP_LIB_DIR)"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Libraries"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lztlp_proto"
          - "-lresolv"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: ZTLPTunnel
        embed: true
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
      - sdk: NetworkExtension.framework
    scheme:
      testTargets:
        - ZTLPTests

  ZTLPTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: ZTLPTunnel
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
      - path: Shared
    entitlements:
      path: ZTLPTunnel/ZTLPTunnel.entitlements
    settings:
      base:
        INFOPLIST_FILE: ZTLPTunnel/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ztlp.app.tunnel
        SWIFT_OBJC_BRIDGING_HEADER: ZTLPTunnel/ZTLPTunnel-Bridging-Header.h
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(ZTLP_LIB_DIR)"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Libraries"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lztlp_proto"
          - "-lresolv"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
      - sdk: NetworkExtension.framework

  ZTLPTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZTLPTests
    dependencies:
      - target: ZTLP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ztlp.app.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
