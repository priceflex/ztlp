name: ZTLP
# NOTE: the checked-in ZTLP.xcodeproj is the source of truth (Copy Files
# phases for Contents/Helpers/ztlp + Contents/Library/LaunchDaemons were added
# with the xcodeproj gem, not xcodegen). This spec is kept roughly in sync;
# Task 6c (2026-09-19) dropped the ZTLPSystemExtension target.
options:
  bundleIdPrefix: com.ztlp
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"

targets:
  ZTLP:
    type: application
    platform: macOS
    sources:
      - path: ZTLP
        excludes:
          - "**/*.plist"
    settings:
      base:
        INFOPLIST_FILE: ZTLP/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ztlp.app.macos
        SWIFT_OBJC_BRIDGING_HEADER: ZTLP/ZTLP-Bridging-Header.h
        SWIFT_VERSION: "5.9"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Libraries"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Libraries"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lztlp_proto"
          - "-lresolv"
          - "-lz"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5527A7TH5P
        CODE_SIGN_ENTITLEMENTS: ZTLP/ZTLP.entitlements
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    scheme:
      testTargets:
        - ZTLPTests

  ZTLPTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ZTLPTests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        # @testable import ZTLP pulls in the bridging header -> needs ztlp.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Libraries"
    dependencies:
      - target: ZTLP
