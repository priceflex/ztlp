[package]
name = "ztlp-proto"
version = "0.28.0"
edition = "2021"
description = "ZTLP (Zero Trust Layer Protocol) Phase 1 prototype — handshake, session, encrypted transport"
license = "MIT"
# All bins require the tokio-runtime feature. Disable autodiscovery so we can
# opt every bin in explicitly via required-features (keeps `cargo test
# --no-default-features --features ios-sync` working for the Linux harness).
autobins = false

[lib]
name = "ztlp_proto"
crate-type = ["lib", "staticlib"]

# Note: C header is manually maintained at include/ztlp.h
# To regenerate from Rust source, install cbindgen and run:
#   cbindgen --config cbindgen.toml --output include/ztlp.h

[features]
default = ["tokio-runtime"]
tokio-runtime = [
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:clap",
    "dep:colored",
    "dep:indicatif",
    "dep:dialoguer",
    "dep:hostname",
    "dep:qr2term",
    "dep:dirs",
]
diag = []
ios-sync = []  # Builds without tokio — for iOS Network Extension
# Experimental QUIC transport (replaces hand-rolled UDP reliability). OFF by
# default — pulls in quinn (tokio-backed) + quinn-proto (sans-io) + rustls.
# Gated so the existing tree keeps building and shipping while the QUIC pivot
# is being developed in parallel. See docs/architecture/quic-noise-handshake.md.
quic-transport = ["dep:quinn", "dep:quinn-proto", "dep:rustls", "dep:rcgen"]

[[bench]]
name = "quic_multistream"
path = "bench/quic_multistream.rs"
harness = false

[dependencies]
# --- Always included (sync core + crypto) ---
snow = "0.9"
chacha20poly1305 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
blake2 = "0.10"
sha2 = { version = "0.10", default-features = false }
subtle = "2.6"
toml = "0.8"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["std"] }
curve25519-dalek = "4"
libc = "0.2"
rustls-pemfile = "2"
ciborium = "0.2"
socket2 = { version = "0.5", features = ["all"] }

# --- Optional: tokio runtime + CLI deps (not needed for iOS NE) ---
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "io-std", "signal", "macros", "process"], optional = true }
tokio-rustls = { version = "0.26", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
colored = { version = "2", optional = true }
indicatif = { version = "0.17", optional = true }
dialoguer = { version = "0.11", features = ["password"], optional = true }
hostname = { version = "0.4", optional = true }
qr2term = { version = "0.3", optional = true }
dirs = { version = "5", optional = true }
httparse = "1.10.1"
hmac = "0.12"

# --- Optional: QUIC transport (gated behind `quic-transport` feature) ---
# Why optional: the QUIC pivot is in-progress (see hermes_session_handoff.md
# Task A). Keeping these gated means default builds — including the iOS
# Network Extension's `ios-sync` profile — stay lean and unchanged while
# the new transport is wired up.
# - `quinn`       : tokio-backed QUIC endpoint for Gateway/Relay.
# - `quinn-proto` : sans-io state machine; used by iOS NE (no tokio, <15MB).
# - `rustls`      : TLS provider required by quinn (we still tunnel Noise
#                   inside the QUIC stream for Ed25519 identity binding).
quinn = { version = "0.11.9", optional = true }
quinn-proto = { version = "0.11.14", optional = true }
rustls = { version = "0.23.40", optional = true }
# Self-signed cert generator. Needed only for the tokio-backed server endpoint
# because rustls/quinn always require a server certificate even though we pin
# identity via the Noise XX prologue tunneled over stream 0 (so the X.509
# layer is effectively ignored). Gated behind `quic-transport` to keep the
# default + ios-sync builds lean.
rcgen = { version = "0.13", optional = true }

[profile.release]
# Default: optimize for speed on desktop/server platforms.
# LTO gives good dead-code elimination without sacrificing speed.
lto = true
codegen-units = 1
strip = true
opt-level = 3      # optimize for speed (default for desktop/server)
# panic = "unwind" is the default — allows catch_unwind and RAII cleanup

[[bin]]
name = "ztlp-node"
path = "src/bin/ztlp-node.rs"
required-features = ["tokio-runtime"]

[[bin]]
name = "ztlp-demo"
path = "src/bin/ztlp-demo.rs"
required-features = ["tokio-runtime"]

