[package]
name = "ztlp-proto"
# Bumped 0.29.3 → 0.29.4 in PR #14 to align with the v0.29.4 strict-routing
# git tag (PR #12) and the relay's mix.exs (PR #13). Bumped 0.29.4 → 0.29.5
# in PR #15 to cut a clean v0.29.5 tag where the git tag and all four
# declared versions agree. Bumped 0.30.0 → 0.30.3 in PR release/v0.30.3
# after the v0.30.3 git tag was cut from a5993ee (PR #40 — Z2LS gateway-
# auth enrollment API). Bumped 0.30.3 → 0.30.4 in PR release/v0.30.4 to
# align manifests with the re-cut v0.30.4 tag (the original v0.30.4
# pointed at 6e9d40b, whose manifests still read 0.30.3). See
# tests/version_pin_test.rs for the regression floor.
# Bumped 0.30.4 → 0.31.0 in release/v0.31.0 (resilient-connectivity).
# Bumped 0.31.0 → 0.32.2 in PR release/v0.32.2 to align with the v0.32 family
# (v0.32 multi-candidate discovery PR #69, v0.32.1 keepalive-port + IPv6
# fixes PR #70, v0.32.2 multi-candidate dial moves into QUIC path + punch
# IPv6 fix PR #71). All three v0.32.x releases shipped while this manifest
# still read 0.31.0; this PR closes that drift so a v0.32.2-tagged binary
# actually reports 0.32.2 via env!("CARGO_PKG_VERSION").
version = "0.34.1"
edition = "2021"
description = "ZTLP (Zero Trust Layer Protocol) Phase 1 prototype — handshake, session, encrypted transport"
license = "MIT"
# All bins require the tokio-runtime feature. Disable autodiscovery so we can
# opt every bin in explicitly via required-features (keeps `cargo test
# --no-default-features --features ios-sync` working for the Linux harness).
autobins = false
# bench/quic_multistream.rs needs criterion + async_tokio dev-deps that
# haven't been wired up yet. Disable autodiscovery so `cargo build
# --all-targets` (CI gate) doesn't trip over the orphaned bench file.
# Re-enable (or add a `[[bench]]` entry) once the dev-deps land.
autobenches = false

[lib]
name = "ztlp_proto"
crate-type = ["lib", "staticlib"]

# Note: C header is manually maintained at include/ztlp.h
# To regenerate from Rust source, install cbindgen and run:
#   cbindgen --config cbindgen.toml --output include/ztlp.h

[features]
default = ["tokio-runtime", "quic-transport"]
tokio-runtime = [
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:clap",
    "dep:colored",
    "dep:indicatif",
    "dep:dialoguer",
    "dep:hostname",
    "dep:qr2term",
    "dep:dirs",
]
diag = []
ios-sync = []  # Builds without tokio — for iOS Network Extension
# Experimental QUIC transport (replaces hand-rolled UDP reliability). Enabled
# by default for desktop/server builds so the shipped `ztlp` CLI exposes the
# QUIC proxy subcommands. Disable with `--no-default-features --features
# tokio-runtime` (or `ios-sync`) when building the iOS Network Extension or
# any other context that needs a lean tree without quinn/rcgen pulled in.
# See docs/architecture/quic-noise-handshake.md.
quic-transport = []

# NOTE: `quic_multistream` criterion bench was added in PR #11 (Phase 5) but
# never wired up criterion as a dev-dependency, so `cargo build --all-targets`
# fails CI. Disabled here pending a proper dev-deps + async_tokio feature
# addition. The source file has been renamed to
# `bench/quic_multistream.rs.disabled` to keep `autobenches` discovery quiet.
# Restore by renaming back and uncommenting this block once criterion is in
# dev-dependencies.
# [[bench]]
# name = "quic_multistream"
# path = "bench/quic_multistream.rs"
# harness = false

[dependencies]
# --- Always included (sync core + crypto) ---
snow = "0.9"
chacha20poly1305 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
blake2 = "0.10"
sha2 = { version = "0.10", default-features = false }
subtle = "2.6"
toml = "0.8"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["std"] }
curve25519-dalek = "4"
libc = "0.2"
rustls-pemfile = "2"
ciborium = "0.2"
socket2 = { version = "0.5", features = ["all"] }

# --- Optional: tokio runtime + CLI deps (not needed for iOS NE) ---
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "io-std", "signal", "macros", "process"], optional = true }
tokio-rustls = { version = "0.26", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
colored = { version = "2", optional = true }
indicatif = { version = "0.17", optional = true }
dialoguer = { version = "0.11", features = ["password"], optional = true }
hostname = { version = "0.4", optional = true }
qr2term = { version = "0.3", optional = true }
dirs = { version = "5", optional = true }
httparse = "1.10.1"
hmac = "0.12"
# v0.32 multi-candidate discovery (M1): pure-Rust cross-platform NIC
# enumeration (Linux/macOS/Windows). Used by `local_candidates` to publish
# the gateway's local interface addresses as ICE-style host candidates in
# PUNCH_REPORT. No winapi headaches, no privileged calls.
if-addrs = "0.13"

# v0.32 multi-candidate discovery (M5): async-trait for the `Dialer` trait
# in `dial_orchestrator`. Lets us mock the dialer in unit tests without real
# UDP, and lets the M6 production dialer impl wrap the real QUIC handshake.
async-trait = "0.1"

# --- Optional: QUIC transport (gated behind `quic-transport` feature) ---
# Why optional: the QUIC pivot is in-progress (see hermes_session_handoff.md
# Task A). Keeping these gated means default builds — including the iOS
# Network Extension's `ios-sync` profile — stay lean and unchanged while
# the new transport is wired up.
# - `quinn`       : tokio-backed QUIC endpoint for Gateway/Relay.
# - `quinn-proto` : sans-io state machine; used by iOS NE (no tokio, <15MB).
# - `rustls`      : TLS provider required by quinn (we still tunnel Noise
#                   inside the QUIC stream for Ed25519 identity binding).
quinn = { version = "0.11.9" }
quinn-proto = { version = "0.11.14" }
rustls = { version = "0.23.40" }
# Self-signed cert generator. Needed only for the tokio-backed server endpoint
# because rustls/quinn always require a server certificate even though we pin
# identity via the Noise XX prologue tunneled over stream 0 (so the X.509
# layer is effectively ignored). Gated behind `quic-transport` to keep the
# default + ios-sync builds lean.
rcgen = { version = "0.13" }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
# v0.32 M5 — `tokio::test(start_paused = true)` requires the `test-util`
# feature so the dial_orchestrator tests can drive mocked time
# deterministically without sleeping for real.
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
# Default: optimize for speed on desktop/server platforms.
# LTO gives good dead-code elimination without sacrificing speed.
lto = true
codegen-units = 1
strip = true
opt-level = 3      # optimize for speed (default for desktop/server)
# panic = "unwind" is the default — allows catch_unwind and RAII cleanup

