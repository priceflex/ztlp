services:
  launch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ztlp-launch
    ports:
      - "${LAUNCH_PORT:-8080}:8080"
    environment:
      # Bind the WSGI app on every interface so ngrok (host network) can reach it.
      LAUNCH_BIND_HOST: ${LAUNCH_BIND_HOST:-0.0.0.0}
      LAUNCH_BIND_PORT: 8080
      LAUNCH_DB_PATH: /app/data/launch.sqlite3
      # Public hostname used to render absolute URLs (claim links etc.).
      LAUNCH_PUBLIC_HOST: ${LAUNCH_PUBLIC_HOST:-localhost:8080}
      # Per-zone bootstrap stack defaults, sourced from .env so they can vary
      # per environment without editing the compose file.
      LAUNCH_INSTANCE_BASE_PORT: ${LAUNCH_INSTANCE_BASE_PORT:-39000}
      LAUNCH_INSTANCE_ROOT: ${LAUNCH_INSTANCE_ROOT:-/app/data/instances}
      LAUNCH_BOOTSTRAP_IMAGE: ${LAUNCH_BOOTSTRAP_IMAGE:-priceflex/ztlp-bootstrap:latest}
      LAUNCH_DEFAULT_ZONE_SUFFIX: ${LAUNCH_DEFAULT_ZONE_SUFFIX:-ztlp}
      # Onboarding policy (POW + referral codes). Sourcing these from .env so
      # operators can rotate referral codes without rebuilding the image.
      # LAUNCH_REFERRAL_REQUIRED defaults to 1 — every onboarding MUST present
      # a valid code from LAUNCH_REFERRAL_CODES. Flip to 0 for legacy dev mode
      # where empty code falls through to POW + rate-limit gating.
      LAUNCH_REQUIRE_POW: ${LAUNCH_REQUIRE_POW:-1}
      LAUNCH_REFERRAL_CODES: ${LAUNCH_REFERRAL_CODES:-}
      LAUNCH_REFERRAL_REQUIRED: ${LAUNCH_REFERRAL_REQUIRED:-1}
      LAUNCH_TOKEN_SECRET: ${LAUNCH_TOKEN_SECRET:-ztlp-launch-dev-secret-change-me}
      # ZTLP infrastructure addresses — these MUST be passed through to the
      # container; otherwise the launch app falls back to the build-time
      # defaults baked into app.py and advertises the wrong NS to users.
      ZTLP_NS_SERVER: ${ZTLP_NS_SERVER:-}
      ZTLP_BOOTSTRAP_LISTENER_ADDR: ${ZTLP_BOOTSTRAP_LISTENER_ADDR:-}
      ZTLP_RELAY_ADDR: ${ZTLP_RELAY_ADDR:-}
      ZTLP_GATEWAY_ADDR: ${ZTLP_GATEWAY_ADDR:-}
      ZTLP_DOWNLOAD_MANIFEST_URL: ${ZTLP_DOWNLOAD_MANIFEST_URL:-https://www.ztlp.net/downloads/manifest.json}
      ZTLP_RELEASE_TAG: ${ZTLP_RELEASE_TAG:-v-before-nebula-collapse}
    volumes:
      - launch_data:/app/data
      # Mount the host docker socket so the launch app can provision
      # per-zone bootstrap stacks via `docker compose up -d`. The launch
      # process runs as a non-root user — group_add gives it read/write
      # access via the docker group GID (typically 999 on Ubuntu hosts).
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the host instances directory so docker-compose stacks the
      # launch app generates live on the host filesystem and are visible
      # to the host's docker daemon when launched.
      - ${LAUNCH_INSTANCE_HOST_ROOT:-./data/instances}:/app/data/instances
    group_add:
      # Host docker group GID. Override with DOCKER_GID env when the host
      # uses a non-default GID. 999 is the default on Ubuntu/Debian.
      - "${DOCKER_GID:-999}"
    # The launch app needs to spawn `docker compose up -d` as a subprocess —
    # remove cap_drop ALL so the alpine docker-cli can fork/exec normally.
    # The bigger security boundary is the docker socket itself; tightening
    # capabilities here is theatre.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

# Bootstrap/admin instances are intentionally NOT exposed here.
# Use bin/launch to create per-instance Docker Compose files under data/instances/.
# Those generated instance files bind private Rails ports to 127.0.0.1 only until
# ZTLP-native service access is wired.

volumes:
  launch_data:
    name: ztlp_launch_data
